name: Local release checks
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roomedy-local-release-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fake-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      FAKE_MODE: 'true'
      PAID_DEMO_ENABLED: 'false'
      LIVE_POLICY_REVIEWED: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # verified v5
        with:
          node-version: 24.19.0
      - run: node scripts/release/install-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: node scripts/release/build-local.mjs --execute
