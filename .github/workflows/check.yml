name: Local no-key checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FAKE_MODE: 'true'
      PAID_DEMO_ENABLED: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # verified v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # verified v5
        with:
          node-version-file: .node-version
      - run: node scripts/release/install-pnpm.mjs
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
